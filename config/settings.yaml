# This file is the single source of truth for runtime settings, and it lives in
# git. Do not edit it through /admin/config — a deploy replaces the container and
# the edit is gone, which is exactly how 2026-08-18's concurrency settings were
# silently lost. Change it here, commit, push; the deploy applies it.
#   "I should be able to walk up with a laptop loaded with only an operating
#    system, and by using the repository, obtain everything I need to build and
#    run the product." — martinfowler.com/articles/continuousIntegration.html

deepseek:
  # 2026-07: DeepSeek retired the "deepseek-chat" model name (supported names:
  # deepseek-v4-pro / deepseek-v4-flash). fingerprint_model pins the extraction
  # cache identity to the old name so the rename does NOT invalidate the whole
  # cache — remove it only if a full re-extraction is intended.
  model: deepseek-v4-flash
  fingerprint_model: deepseek-chat
  temperature: 0.1
  timeout_seconds: 60
  # Characters of page text sent to the model. Half of a sum that free tiers
  # charge against a per-minute token window, so it is throughput as much as
  # quality — see max_output_tokens.
  max_text_chars: 8000
  # Cap on generated tokens, sent on every request. NOT safety headroom:
  # Groq's free tier reserves prompt + max_tokens against an 8,000-token
  # minute window *before* generating, so leaving it unset (as we did until
  # 2026-08-19) reserved the model's maximum on every call — one request a
  # minute at best. That is why Groq stopped at 354 calls in a day and 838 of
  # Gemini's 1,205 came back 429.
  #
  # Raising this "for safety" makes runs slower, not safer. If the log shows
  # llm_output_truncated, cut max_text_chars first: past the useful content of
  # a page, that half of the sum buys nothing.
  max_output_tokens: 1500
  rate_limit_seconds: 1.0

search:
  results_per_query: 10
  max_pages_per_topic: 5
  rate_limit_seconds: 1.5
  # "live" = instant, $2/1K queries. "standard" = task queue: $0.6/1K normal
  # or $1.2/1K high priority. Manual dashboard runs also use this mode.
  dataforseo_mode: standard
  # 1 = normal queue ($0.6/1K, ~5 min average, 45 min stated target).
  # 2 = priority queue ($1.2/1K, ~1 min). Live mode is $2/1K.
  #
  # We paid double because the collector polled for at most 5 minutes and
  # processed one pair at a time, so a slower queue meant timeouts. Both halves
  # of that are gone: the poll window follows the priority (25 min on normal),
  # and pipeline.search_concurrency overlaps the waits. Switching to 1 halves
  # the search bill — do it together with search_concurrency, never alone.
  standard_priority: 1

fetch:
  timeout_seconds: 15
  min_text_length: 100
  max_concurrent: 3
  blocked_domains:
    - twitter.com
    - x.com
    - facebook.com
    - instagram.com
    - tiktok.com
    - linkedin.com
    - youtube.com
    - reddit.com

pipeline:
  # Order the worker walks countries in. A run ends when the work signal flips
  # (quota spent, or quota returned), so a country behind a large unfinished
  # backlog may not be reached in a given pass — this list is the expansion
  # priority. Countries not named here run last, in config order. Hungary leads
  # since the 2026-08-16 import of every 1000+ inhabitant settlement (973 new,
  # unprocessed) on the primary market.
  country_priority:
    - Hungary
    - Germany
    - Indonesia
    - Sweden
  # How many pages may have their community extraction in flight at once.
  # 1 = the serial chain: one request at a time across a fleet whose combined
  # ceiling is 185 calls/min, which is why the 2026-08-17 window managed 3.3
  # extractions/min and left 15,690 free calls to expire. Raise to spend the
  # daily budget in hours instead of never; lower to 1 to rule concurrency out
  # when diagnosing. Change it here and deploy — config/ is not persisted, so an
  # edit made through /admin/config is gone at the next deploy (which is how the
  # first day of concurrency settings was lost). The editor is read-only now.
  extract_concurrency: 4
  # How many pairs may have their *search* in flight at once. The collector
  # spends 45-70s per pair waiting on a queued DataForSEO task, and pairs are
  # independent, so 1 leaves that wait unoverlapped. This is also what makes
  # search.standard_priority: 1 worth having — half the price ($0.6 vs $1.2 per
  # 1K SERPs) for a slower queue only pays off when the waits overlap.
  search_concurrency: 8
  # Content failures at one fingerprint after which a page stops being
  # re-extracted. A failed extraction is deliberately never cached — caching it
  # would record "0 communities" permanently — so without this a page whose
  # answer cannot fit the token cap is attempted by every run, against every
  # provider, forever. On 2026-08-26 that was ~21 pages × ~30 runs, roughly ten
  # thousand charged calls for 335 pages of actual output.
  #
  # Only failures where a model *answered* and the answer was unusable count.
  # An outage, a 429 or a spent quota says nothing about the page. 3 is low
  # enough to stop the bleeding within a day and high enough that a genuinely
  # unlucky page still gets three tries across three separate runs; 0 disables
  # the quarantine. Releases automatically when the fingerprint changes, and by
  # hand at /admin/quarantine.
  extract_max_page_failures: 3
  # The separate LLM person-extraction call. Off since 2026-09-24: it spent a
  # quarter of all extraction calls and saved no one (see PipelineConfig).
  # Leaders still reach the people pages from the community `leader` field.
  llm_person_extraction: false
  test_mode: false
  test_cities:
    - Szentendre
    - Budapest
    - London
  enrich_communities: true
  # Topics searched for cities marked `topic_tier: core` in cities.yaml (small
  # towns where niche topics can't yield results). Tiered-out pairs are fully
  # frozen: no search, no re-extraction. Empty list = tiering disabled.
  #
  # Cut 12 -> 6 on 2026-08-16, from measurement rather than intuition: sampling
  # /api/city-topics across 20 small Hungarian and 20 small German towns gave the
  # SAME top five on both markets (senior, volunteering, choir, religion, dance),
  # with fitness sixth on combined town coverage. The five dropped topics —
  # running, music, hiking, cycling, board_games — each found something in at
  # most a quarter of the sampled towns, and hiking/cycling in almost none.
  # Halving the list roughly halves the DataForSEO bill for the 973 Hungarian
  # settlements added the same day.
  #
  # `hagyomanyorzes` outperformed several of these in Hungary (29 records / 10
  # towns) but scored zero in the German sample, so it stays out of a list that
  # is global. Re-measure before adding a market-specific topic here.
  core_topics:
    - senior
    - volunteering
    - choir
    - religion
    - dance
    - fitness

# ── Joinability gate ────────────────────────────────────────────────────────
# One cheap typed question (TypeSafe Jev) before an expensive extraction:
# "is there a joinable community on this page at all?". 81.8% of extracted
# pages yield none, and each of those costs a full call from a free fleet that
# allows ~2,100 a day.
#
# Measured 2026-09-21 on 525 corpus-proportioned pages: 16% rejected, **one**
# genuine loss, 40.9% of calls saved. On 1,200 pages the day before, every page
# scoring below 0.06 turned out to be a page where the *extractor* was wrong —
# a hotel spa, a sightseeing listing, two records that were just a village's
# name. See docs/wiki/pages/integrations/jev-joinability-gate.md.
#
# TWO LOCKS, like the paid extraction providers, and for the same reason: in
# 2026-08 a permission without an amount burned ~$60 in four days. `enabled`
# is the permission; `daily_budget_usd` is the amount, and **0 means no gate
# calls at all**. Both must be set.
#
# The threshold is not a free parameter. 0.06 is where the boundary was
# measured: below it every rejection was an incumbent error, and at 0.10 real
# associations start falling out. Re-measure after any prompt change — the
# labels move with it — and note that changing the threshold or the question
# re-opens every held page automatically, because both are in the fingerprint.
gate:
  enabled: false
  threshold: 0.06
  model: typesafe/jev
  # "cloudflare" bills from the AI Gateway's prepaid balance with the token the
  # extraction fleet already uses; "typesafe" needs TYPESAFE_API_KEY.
  provider: cloudflare
  account_id: "809bd7dcd8939fa5e520a96ab4923429"
  # ~$0.115 per 1,000 pages at 2,136 input tokens each. 0.50 covers a day of
  # collection several times over; reaching it turns the gate off until
  # midnight UTC and every page is extracted, which is how it worked before.
  daily_budget_usd: 0.00

cache:
  skip_scraped: true
  skip_extracted: true
  search_ttl_days: 3650

schedule:
  # ── Continuous worker: the only thing that runs the pipeline ──────────────
  # Nothing is clock-bound. The worker picks extraction while free quota
  # remains — it expires at 00:00 UTC — and collection once it is gone. Quota
  # returning at midnight is a condition the collector watches for, not a
  # schedule, so extraction resumes on its own. A restart simply starts it
  # again, which is why a deploy no longer costs a collection run.
  #
  # The twin cron windows this replaced were deleted on 2026-09-20. They had
  # not been registered with the scheduler since the worker shipped on
  # 2026-08-18: `saver_enabled`, `extract_cron`, `extract_until`,
  # `search_cron`, `search_until`, `cron`, `cron_enabled` and
  # `auto_run_on_startup` were all still here, all still read by code, and
  # none of them could change what the process did. See
  # docs/wiki/pages/decisions/continuous-worker.md.
  #
  # false = run nothing at all. That is a maintenance switch now, not a
  # fallback to another scheduler: there is no other path.
  worker_enabled: true
  # First job of every UTC day: materialize at most ten quality-gated guides
  # from existing records. Hungary leads, then pipeline.country_priority, then
  # all remaining countries. One routed LLM call writes each qualified article;
  # no new search request is used.
  guides_enabled: true
  guides_daily_limit: 10
  guides_min_communities: 8
  guides_min_description_ratio: 0.6
  guides_min_dimensions: 3
  # ── Description enrichment ────────────────────────────────────────────────
  # SEO short/long descriptions. Started by the worker, which also restarts it
  # if it ever stops; bounded per round and idempotent/resumable via the
  # long_description marker. Shares the free fleet's daily budget with the
  # extractor — the quota ledger reloads periodically so neither spends the
  # other's allowance blind — and deliberately does NOT reserve the run
  # coordinator, so it coexists with ai_only.
  enrich_enabled: true
  enrich_batch_limit: 200
  # Daily summary email (traffic + changes per site + runs). Recipient =
  # REPORT_EMAIL or FEEDBACK_EMAIL env; sent via Resend. 04:30 UTC = 06:30 CEST.
  # The one remaining cron in the system.
  report_enabled: true
  report_cron: "30 4 * * *"
