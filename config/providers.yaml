# Free-tier LLM provider catalogue for the model router (scraper/router.py).
#
# WHY THIS IS CONFIG, NOT CODE
# Free providers rename and retire models constantly — Groq deprecated
# llama-3.1-8b-instant and llama-3.3-70b-versatile in June 2026, DeepSeek
# retired "deepseek-chat" in July 2026 and cost us a whole extraction window
# (docs/wiki/pages/post-mortems/2026-07-deepseek-model-retired.md). Editing a
# model name here is a code change like any other: edit it in git and deploy.
# config/ is NOT a persisted volume — an edit made through /admin/config is
# gone at the next deploy (proven 2026-08-18, when settings changed in the
# repository reached production and UI edits did not).
#
# HOW THE ROUTER USES THIS
# Routing happens BEFORE generation, not as a cascade: the router picks the
# highest-quality model that still has quota and calls it once. Cascades pay the
# cheap model's generation before every escalation decision, and a pre-generation
# router beat the best cascade policy on 4 of 5 datasets in arXiv:2605.06350.
# See docs/wiki/sources/2026-08-16-llm-routing-arxiv-research.md.
#
# FIELDS
#   enabled       false parks a provider without deleting its config.
#   api_key_env   Missing/empty env var → the provider is skipped silently.
#                 That is the normal state for one we have not signed up for.
#   base_url      Must speak the OpenAI /chat/completions contract.
#   paid          true = costs money. The router only reaches these when
#                 `router.allow_paid` is on; DeepSeek is parked by default.
#   quality       0-100 score for this model on OUR task. Most are now MEASURED
#                 by scripts/score_providers.py against a golden set of our own
#                 cached pages (2026-08-16), not read off a leaderboard. Treat as a weak prior, not truth: LLMStructBench
#                 (arXiv:2602.14743) found prompting strategy matters more than
#                 model size for JSON extraction, so a leaderboard rank is a
#                 poor proxy. `scripts/score_providers.py` overwrites these with
#                 measured scores from our own golden set — do that before
#                 trusting the ordering.
#   tpd           Tokens per day, 0 = unknown. For several free tiers this is
#                 the ceiling that actually binds and a request count cannot
#                 express it: Groq allows 14,400 requests but only 200,000
#                 tokens, and on 2026-08-20 it refused with
#                 "TPD: Limit 200000, Used 199087" after about 390 calls while
#                 the catalogue planned for 13,680. Read from the provider's own
#                 refusal, not from a docs page.
#   rpm / rpd     Published free-tier limits (2026-08). Several providers
#                 stopped publishing numbers, so these are conservative
#                 starting points; the ledger LEARNS the real limit from 429s
#                 and persists it, which is what actually governs routing.
#   json_mode     false = the provider rejects response_format=json_object;
#                 the router falls back to prompt-only JSON instructions.

router:
  # Master switch. Off → the old single-provider DeepSeek path, unchanged.
  enabled: true
  # ON since 2026-08-24. The free fleet manages ~105 pages a day against a
  # backlog of 91,919, and Cerebras ending its free tier took a third of what
  # capacity there was. Paid providers do not jump the queue: the router picks
  # by measured quality, so the free models still go first and paid ones are
  # reached when the free budget is spent. Overflow, not replacement.
  # OFF since 2026-09-05, at the operator's instruction: no path may spend money
  # on a model for now. This is the *permission*, and `daily_budget_usd` below
  # is the *amount*; `paid_allowed()` requires both, so either one alone already
  # blocks a paid call. Both are set, deliberately — the OpenRouter account now
  # holds $10.80 of real money (bought to unlock the free tier's 1000/day, not
  # to spend), and one config line is a thin guard for a live balance. The paid
  # providers are also `enabled: false` individually further down, so a paid
  # call now needs three separate reversals rather than one.
  allow_paid: false
  # ── The money ceiling ────────────────────────────────────────────────────
  # What every paid provider together may spend in one UTC day. Reached → paid
  # providers are unavailable until midnight and the day finishes on free
  # capacity, which is the ordinary end of a window, not an outage.
  #
  # **0 means no paid calls at all, and that is the safe default.** On
  # 2026-08-24 `allow_paid` was switched on by itself. The provider it was
  # switched on *for* — openrouter_paid, measured cheapest and best — had no
  # credit on the account, so all 41 of its calls a day were refused and every
  # page fell through to DeepSeek's own API: four times the price, 4 answers in
  # 14, and every truncated answer charged in full. Four days, roughly $60, and
  # nothing in the system held a number that could have noticed, because the
  # ledger counted requests and tokens and the bill was in dollars.
  #
  # **0.00 since 2026-08-27, deliberately — and since 2026-09-05 the reason is
  # stronger, not weaker.** There is now $10.80 on the OpenRouter account. It
  # was not put there to buy extraction: it was bought to cross OpenRouter's
  # $10 all-time-purchase threshold, which raises the `:free` daily cap from 50
  # to 1000. Spending it is therefore actively counterproductive, and spending
  # *past* it is worse — a negative balance makes OpenRouter answer 402 on the
  # free models too, which would cost us the capacity the money was for.
  # `openrouter_paid` shares `OPENROUTER_API_KEY`, so this ceiling is the only
  # thing standing between that balance and a paid call. DeepSeek's own account
  # still holds $0.69 and is not being topped up. The free fleet is unaffected:
  # the ceiling vetoes paid providers only, and `has_capacity()` still answers
  # yes while any free allowance is left.
  #
  # To switch paid back on, put credit on the account and set an amount here.
  # $2.00 was the figure this shipped with and is a reasonable one to return
  # to: at openrouter_paid's price a day's extraction is a few cents, while at
  # the rate the 2026-08-24 experiment actually burned it is caught before
  # lunch. `allow_paid` above stays true — it is the permission; this is the
  # amount, and the amount is what is currently zero.
  daily_budget_usd: 0.00

providers:

  # ── Groq ──────────────────────────────────────────────────────────────────
  # Fastest free inference. Not the largest daily allowance — that is Gemini;
  # Groq's day ends on tokens (tpd), usually inside ~150 calls.
  - name: groq
    enabled: true
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    rpm: 30
    # 1000, not 14400. 14,400/day is Groq's *organisation* default; the docs'
    # per-model table gives every model we run (gpt-oss-120b, gpt-oss-20b,
    # qwen3.6-27b) "RPM 30, RPD 1K, TPM 8K, TPD 200K" — confirmed against
    # console.groq.com/docs/rate-limits on 2026-09-05. It is not the binding
    # limit (tpd is), but the ledger budgeted against a figure 14x too high.
    rpd: 1000
    # Measured from Groq's own 429 on 2026-08-20: "tokens per day (TPD):
    # Limit 200000". This, not rpd, is what ends Groq's day.
    tpd: 200000
    models:
      - model: openai/gpt-oss-120b
        quality: 62
      # qwen/qwen3.6-27b removed 2026-09-18. Absent from Groq's own list, and a
      # real call through the gateway settles it: HTTP 404, "The model
      # `qwen/qwen3.6-27b` does not exist or you do not have access to it".
      # Groq now serves qwen3.8-27b in its place.
      #
      # Deliberately not replaced. It scored 55, below both gpt-oss models
      # already here (62 and 67), so its successor would sit in a slot the
      # router reaches only when the better two are spent — while costing one
      # preflight probe per run, which is what the dead entry was costing:
      # roughly 80 guaranteed 404s a day out of the 746 preflight calls on
      # 2026-09-17. Adding a model needs a reason beyond the shape of the gap
      # left by the one that died.

  # ── Groq, gpt-oss-20b — its own entry since 2026-09-24 ──────────────────
  # Groq's limits are per model (the table quoted above), but the ledger keys
  # by catalogue entry: as one entry, the two models shared one 200K-token day,
  # so half of Groq's daily capacity was never budgeted, and a "tokens per day"
  # 429 on one model blocked the other. Same split as Gemini's on 2026-09-10.
  - name: groq_20b
    enabled: true
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    rpm: 30
    rpd: 1000
    tpd: 200000
    models:
      - model: openai/gpt-oss-20b
        quality: 67

  # ── Cerebras ──────────────────────────────────────────────────────────────
  # Very fast, large daily token budget, smaller catalogue than Groq.
  # DISABLED 2026-08-23: Cerebras ended its free API tier on 2026-08-17 and
  # moved existing accounts to a credit-based plan that requires a payment
  # method. Every call since answers HTTP 402 "billing limit" — 283 of them on
  # 2026-08-22, all refused, and because gemma-4-31b scores 80 it was the
  # router's first pick each time. Re-enable only if the account is put on a
  # paid plan, and then move it behind `router.allow_paid` where paid providers
  # belong. The ledger now blocks a 402 provider for the rest of the UTC day,
  # so this line saves one wasted first-choice call a day, not the whole loss.
  # Re-checked 2026-09-19 against Cerebras's own FAQ, because "the free tier
  # ended" and "there is no free tier" are different facts and only the second
  # closes the question: "Is there a permanently free tier? **No.**… $5 in
  # credits that expire 30 days after they're granted", with a verified payment
  # method required to receive them. So `rpd: 1000` below is not a budget, and
  # `gemma-4-31b`'s quality of 80 — still the highest number in this file — is
  # not an argument for re-enabling it. See [[2026-08-cerebras-free-tier-ended]].
  - name: cerebras
    enabled: false
    api_key_env: CEREBRAS_API_KEY
    base_url: https://api.cerebras.ai/v1
    rpm: 30
    rpd: 1000
    models:
      - model: gpt-oss-120b
        quality: 44
      - model: gemma-4-31b
        quality: 80
      # llama-4-scout-17b-16e-instruct removed 2026-08-16: 404 model_not_found
      # in preflight. The other two Cerebras models serve fine — this is a name
      # that does not exist here, not an account problem.

  # ── Google Gemini (AI Studio) ─────────────────────────────────────────────
  # SPLIT IN TWO on 2026-09-10, because Gemini's limits are per *model* and one
  # provider entry can only hold one set. The old single entry carried the
  # compromise `rpm: 10, rpd: 1500` and on 2026-09-09 that produced **1,090
  # HTTP 429s across 1,200 calls** — roughly a third of the whole fleet's daily
  # refusals, from one misconfigured provider.
  #
  # The real numbers, read from this account's own AI Studio rate-limit
  # dashboard (aistudio.google.com/rate-limit) rather than from documentation,
  # which Google no longer publishes:
  #
  #     Gemini 3.6 Flash        RPM 5    TPM 250K   RPD 20
  #     Gemini 3.5 Flash-Lite   RPM 15   TPM 250K   RPD 500
  #
  # So the true daily allowance is **520**, not 1,500 — and 3.6 Flash is spent
  # after twenty calls. Because it scored one point higher (64 vs 63) the router
  # picked it first every time and then took a 429 for the rest of the day.
  #
  # Worse, the wrong number disabled the ledger's own correction. `QuotaLedger`
  # only lowers `observed_limit` when a 429 arrives *near the configured
  # allowance*; a refusal at call 21 against a configured 1,500 reads as a
  # per-minute limit and teaches it nothing. A 75x-too-high `rpd` does not just
  # over-plan — it guarantees the ledger never learns better.
  - name: gemini
    enabled: true
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    # Flash-Lite carries the work: 500 a day against Flash's 20. `rpm: 15` is
    # its real limit — the old 10 was a compromise with Flash and left a third
    # of this model's throughput unused.
    #
    # These numbers can no longer be re-checked against Google. As of
    # 2026-09-19 the rate-limits page carries no free-tier table at all and
    # points at the AI Studio dashboard instead, and the pricing page says only
    # "Free of charge". What keeps the 500 honest is observation, not the
    # vendor: 485 calls on 2026-09-17 and 313 by 20:00 on 2026-09-19, both
    # against a ledger budget of 475 — the day ends where it is supposed to.
    # Treat a future edit here as a measurement, not a documentation lookup.
    rpm: 15
    rpd: 500
    models:
      - model: gemini-3.5-flash-lite
        quality: 63

  # ── Google Gemini 3.6 Flash — REMOVED 2026-09-11 ──────────────────────────
  # Added 2026-09-10 as its own entry with the real limits (RPM 5, RPD 20), and
  # the entry was right: `gemini_flash` took exactly the 19-20 calls a day it
  # was budgeted. It is the *model* that was not worth having. Two days:
  #
  #     2026-09-10   19 calls   19 errors    0 served
  #     2026-09-11   20 calls   18 errors    2 served
  #
  # Two successful extractions out of 39 attempts, for one quality point over
  # Flash-Lite (64 vs 63) — a gap [[free-tier-model-router]] already says is not
  # a reliable ordering. The block's own note said deleting it was the whole
  # change if twenty calls ever looked like more trouble than they were worth;
  # 37 refusals for 2 answers is that.
  #
  # Flash-Lite keeps the Gemini slot and is healthy on it: 479 calls and **3**
  # errors on 2026-09-11, against 1,102 errors the day before the split.

  # ── Mistral ───────────────────────────────────────────────────────────────
  # `rpd: 500` is an estimate and has never been anything else. Mistral moved
  # its free-tier limits behind a login (admin.mistral.ai/plateforme/limits) and
  # publishes no number anywhere public — checked 2026-09-19 — so the widely
  # quoted figures are third-party. The ledger is what makes this safe: it
  # learned 406 on 2026-09-17 from a 429 and 382 on 2026-09-19, both well under
  # the 500 planned here, and a learned ceiling expires so a quiet day cannot
  # pin us low forever.
  #
  # Deliberately not hand-corrected to the observed number. A figure typed from
  # yesterday's observation goes stale exactly the way Groq's `rpd: 14400` did
  # (wrong by 14x for eighteen days); the learned ceiling re-measures every day
  # and costs one refused call to do it.
  - name: mistral
    enabled: true
    api_key_env: MISTRAL_API_KEY
    base_url: https://api.mistral.ai/v1
    rpm: 20
    rpd: 500
    models:
      - model: mistral-small-latest
        quality: 80
      - model: open-mistral-nemo
        quality: 76

  # ── OpenRouter (`:free` models) ───────────────────────────────────────────
  # One key, many models. Was the tightest free budget of the set at 50/day
  # until 2026-09-05.
  - name: openrouter
    enabled: true
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    rpm: 20
    # 1000, not 50. OpenRouter gates the `:free` daily cap on credit *purchased
    # all time*, not on the balance: under $10 it is 50/day, at or above it
    # 1000/day, and the higher tier survives the balance being spent back down
    # (openrouter.ai/docs/api-reference/limits). $11.00 was bought on
    # 2026-09-05 for exactly this, so the ceiling is now twenty times what it
    # was. `rpm` is unchanged — 20/min applies to every `:free` model
    # regardless of purchase history, and at 20/min a full 1000 takes ~50
    # minutes of pure OpenRouter time.
    #
    # The learned ceiling does not block this: `QuotaLedger.budget()` prefers
    # `observed_limit`, but that lives in the per-UTC-day usage row, so each
    # day starts from this number again and only a genuine "per day" 429
    # lowers it.
    rpd: 1000
    models:
      - model: nvidia/nemotron-3-super-120b-a12b:free
        quality: 58
      - model: google/gemma-4-31b-it:free
        # Left at 52 despite answering 0 of 20 on 2026-09-18. That run is void
        # for this model, not damning: every failure was `api_rate_limited` with
        # a 60-second wait — Google AI Studio refusing upstream, which is what
        # OpenRouter's `:free` gemma sits behind, and the same refusal a manual
        # call hit on 2026-09-05. A provider that will not answer has not been
        # measured. Re-score it when it will.
        quality: 52
      # deepseek/deepseek-v4-flash-0731:free removed 2026-09-21, three days
      # after it was added — and it was the best model on this provider:
      # quality 76 against nemotron's 68, answering 14 of 20 where nemotron
      # managed 10. A real call now returns HTTP 404, "This model is
      # unavailable for free. The paid version is available now - use this slug
      # instead: deepseek/deepseek-v4-flash", which is the same sentence
      # gpt-oss-20b got a fortnight earlier.
      #
      # Not re-added as the paid slug: `allow_paid` is false, the budget is
      # 0.00, and both are deliberate.
      #
      # The three days are the lesson, not the loss. This entry took two
      # evenings of measurement — a 4,000-token cap, then 8,000, each justified
      # by counting truncations — and the catalogue withdrew it before the
      # third. Measure a free model before trusting it, and expect to do it
      # again: what is free today is a 404 on Sunday. The 404 costs one call
      # per run per model until the entry is removed, which is why this is a
      # deletion and not an `enabled: false`.
      # openai/gpt-oss-20b:free removed 2026-09-05. Absent from OpenRouter's
      # public catalogue (431 models, 19 `:free`) and, unlike the recurring
      # open-mistral-nemo case, a real call agrees: HTTP 404 "This model is
      # unavailable for free. The paid version is available now - use this slug
      # instead: openai/gpt-oss-20b". Not added back as the paid slug — quality
      # 45 was the weakest of the three, and `daily_budget_usd` is 0.00. The
      # other two were re-confirmed live the same day.

  # ── Cloudflare Workers AI ─────────────────────────────────────────────────
  # Added 2026-09-05. The only provider whose budget is denominated in neither
  # requests nor tokens: the free allocation is **10,000 Neurons a day**, and
  # the response's `usage.neurons` reports what a call actually cost — so this
  # is the one provider we could book exactly rather than estimate. The ledger
  # has no neuron unit, so the allowance is expressed as `rpd` below.
  #
  # The account is on the **Workers Free** plan (verified in the dashboard
  # 2026-09-05), where exceeding the daily allocation refuses requests rather
  # than billing. That is what makes this a free-tier provider at all; if the
  # account is ever upgraded to Workers Paid, overage bills and this entry must
  # be re-examined before the next run.
  - name: cloudflare
    enabled: true
    api_key_env: CLOUDFLARE_API_TOKEN
    # The account id is not a secret — it is in every dashboard URL — so it is
    # inlined here rather than templated, which keeps this a catalogue entry
    # with no code behind it.
    base_url: https://api.cloudflare.com/client/v4/accounts/809bd7dcd8939fa5e520a96ab4923429/ai/v1
    rpm: 20
    # 100, from measurement rather than a published figure. One real extraction
    # — our own SYSTEM_PROMPT plus a page at the `max_text_chars: 8000` cap —
    # cost **91.9 neurons** on gpt-oss-20b (3,531 in / 1,016 out). 10,000/91.9
    # is 108, and 100 leaves room for pages that generate more output. The
    # ledger's own 5% headroom takes the effective figure to 95, or ~8,700
    # neurons: 87% of the allowance.
    #
    # gpt-oss-120b was measured too and is deliberately **not** listed: at
    # 176.9 neurons it halves the day to 56 calls, and our own catalogue
    # already scores the 20b higher than the 120b on Groq. One model also makes
    # the neuron spend predictable, which a two-model mix would not be.
    rpd: 100
    models:
      - model: '@cf/openai/gpt-oss-20b'
        # 74, measured 2026-09-05 on the largest independent sample. Four runs,
        # and the spread is the point:
        #
        #     2 pages  (sample 9609dafa)  -> 20
        #    10 pages  (sample 410610e1)  -> 89
        #    10 pages  (sample 410610e1)  -> 84   <- same sample, re-run
        #    20 pages  (sample c47a3a02)  -> 74   <- independent, and chosen
        #
        # The 84/89 pair is one sample measured twice, so it shows the model's
        # own non-determinism (±5), not how much the score moves with different
        # pages. The 2-page 20 and the 20-page 74 are different samples, and
        # they are what say the number is sample-sensitive. Taking 74 rather
        # than the flattering 86 keeps it *below* mistral-small (80): the fleet
        # still opens on Mistral, and this is second. On 95 calls a day the
        # blast radius of being wrong is bounded either way, but there is no
        # reason to buy the optimistic reading.
        #
        # Note what this does NOT claim. Groq serves the *same weights* at
        # `quality: 67`, and the two numbers come from different measurement
        # runs on different samples — the spread above shows a single sample
        # moves this score by more than the 7 points between them. So the
        # router draining Cloudflare's 95 calls before touching Groq's copy is
        # a **capacity** ordering, not evidence that one host is better. It is
        # a defensible one (Cloudflare's allowance expires daily and is the
        # smaller of the two), but do not read the gap as quality, and do not
        # "fix" it by nudging either number without re-scoring both together.
        quality: 74

  # ── Our own GPU (llama.cpp on the operator's Mac) ────────────────────────
  # A provider with no quota. Every other entry in this file is rationed by
  # somebody else's allowance; this one is rationed by wall-clock, which is why
  # it is worth having even though it does not top the quality order. On
  # 2026-09-05 the whole free fleet was spent by 22:30 UTC — that is the hole
  # this fills, not a better answer.
  #
  # MEASURED on one shared sample (hu golden set d13dfe914a92, 16 pages, 17
  # expected communities), so these three numbers are comparable with each
  # other:
  #
  #     Qwen3-4B  Q4_K_M   73   2.5 GB
  #     Qwen3-8B  Q4_K_M   67   5.0 GB
  #     gpt-oss-20b MXFP4  65  12.1 GB
  #
  # The smallest model won, and it won on the machine where it also runs
  # fastest. That is not a fluke to be explained away — it is the result this
  # file already warns about in its own header: LLMStructBench (arXiv:2602.14743)
  # found prompting strategy outweighs model size for JSON extraction. Read it
  # as evidence that our prompt does the work, not that 4B beats 20B in general.
  #
  # It also settled the memory question by itself. On a 16 GB machine that its
  # owner is actually using, the 8B ran at 5.4 tok/s (against 15.8-16.6 on an
  # idle one) because everything else was paging; the 4B leaves 2.5 GB more
  # headroom and does not have that problem.
  #
  # llama.cpp, NOT Ollama. Ollama packages gpt-oss as MXFP4, and that path does
  # not reach Metal on Apple Silicon: 14.5 tok/s with `ollama ps` reporting
  # 19%/81% CPU/GPU, against llama.cpp's 27-29 tok/s on the same machine and
  # the same weights. Prefill went 124 -> 290 tok/s. The runtime was the
  # variable, not the hardware.
  #
  # BOTH the address and the key come from the environment, and the provider is
  # skipped silently unless both are set — which is the correct state whenever
  # the machine is asleep, closed, or off. `base_url` is deliberately empty:
  # there is no sensible default for a tunnel, and a stale one would send every
  # call in the run to a dead host.
  - name: localgpu
    enabled: true
    base_url: ""
    base_url_env: LOCAL_GPU_URL
    api_key_env: LOCAL_GPU_KEY
    # No allowance exists, so these are not budgets — they are large enough not
    # to bind, and `rpm` is what actually paces us: llama-server answers one
    # request at a time, and a low value here would idle the GPU between pages.
    rpm: 600
    rpd: 100000
    tpd: 0
    paid: false
    # 600 s, against the global 60. The global is sized for a hosted API
    # answering in seconds; this model spends 27 s on a *short* golden-set page
    # and production sends the full `max_text_chars: 8000`. A timeout is scored
    # as a failure, so the wrong number here would not report a slow provider —
    # it would retire a working one through the circuit breaker.
    #
    # Note this is NOT the binding limit. Cloudflare's proxy gives an origin
    # 100 seconds on every non-Enterprise plan and answers 524 after that, so
    # the real ceiling is 100 s no matter what is set here. `max_concurrency: 1`
    # below is what keeps a single call comfortably inside it; this number only
    # has to be larger than that ceiling.
    timeout_seconds: 600
    # ONE call at a time. Not a politeness setting — the GPU is the bottleneck,
    # so four concurrent pages do not return four answers in the time of one;
    # they return four answers each about four times slower (measured 27 tok/s
    # alone against 1.85 tok/s with four slots busy). Nothing is gained, and on
    # 2026-09-06 the quadrupled latency pushed every call past Cloudflare's
    # 100-second origin timeout: HTTP 524 on extractions that were working.
    # `pipeline.extract_concurrency: 4` is right for hosted APIs, where the wait
    # is network latency and overlapping is free; this is the exception.
    max_concurrency: 1
    # 4,000, against the free fleet's 1,500 — the one place that rule inverts.
    # The 1,500 exists because Groq reserves `prompt + max_tokens` against an
    # 8,000-token minute window *before* generating. Nothing is reserved here
    # and nothing is billed, so the cap costs only the seconds actually spent.
    max_output_tokens: 4000
    models:
      # llama-server ignores the `model` field and serves whichever GGUF it was
      # started with, so this name is a label — for our logs and for the
      # (provider, model) key score_providers.py writes back to. Keep it
      # describing the file actually loaded.
      #
      # That server MUST run with `--chat-template-kwargs
      # '{"enable_thinking":false}'`. Qwen3-4B ignores llama.cpp's generic
      # `--reasoning-budget 0` and reasons in PLAIN TEXT — no <think> tags, no
      # reasoning field — so the thinking lands in `content` and every answer is
      # unparseable. That raises ExtractorContentError, which is exactly what
      # `_Quarantine` counts: three per page retires a real page for good. The
      # first scored run with the wrong flag failed all 16 pages this way.
      - model: qwen3-4b-q4km
        quality: 73

  # ── GitHub Models ─────────────────────────────────────────────────────────
  # DISABLED 2026-08-16: the API answers 410 with
  # {"code":"github_models_retirement_brownout"} — the service is being retired,
  # not rate limited. Kept here rather than deleted so the decision is visible.
  #
  # Confirmed finished 2026-09-19 against GitHub's own documentation: "As of
  # July 30, 2026, GitHub Models has been fully retired… the playground, model
  # catalog, inference API, and bring your own key (BYOK) are no longer
  # available to any customer." So the 410 is not a brownout to wait out, and
  # `rpd: 150` below describes an allowance that no longer exists. Nothing to
  # re-enable; the entry is a headstone.
  - name: github
    enabled: false
    api_key_env: GITHUB_MODELS_TOKEN
    base_url: https://models.github.ai/inference
    rpm: 10
    rpd: 150
    models:
      - model: openai/gpt-4.1-mini
        quality: 57
      - model: meta/Llama-3.3-70B-Instruct
        quality: 47

  # ── DeepSeek (paid — parked) ──────────────────────────────────────────────
  # The incumbent. Kept last and gated behind router.allow_paid so free capacity
  # is always spent first. Its model/fingerprint pinning still lives in
  # settings.yaml under `deepseek:`.
  - name: deepseek
    # Disabled 2026-09-05 alongside `allow_paid: false` — see there. $0.69 left
    # on the account and no top-up; re-enable together with the two switches
    # above, not on its own.
    enabled: false
    paid: true
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    rpm: 60
    rpd: 100000
    models:
      # Their own API serves exactly three models and this alias is the 0731
      # snapshot (checked against /v1/models 2026-08-24). $0.22/$0.66 per 1M
      # off-peak, double in peak — weekdays 01:00-04:00 and 06:00-10:00 UTC.
      # The cheaper 0423 snapshot is not on this endpoint at all; it is reached
      # through OpenRouter below, at roughly a quarter of the price.
      #
      # 23, not the 80 it scored. `POST /v1/score` measures answer *quality* on
      # the pages a model answered, and this one answered **4 of 14** Hungarian
      # pages on 2026-08-24 — 28 truncations. It is a reasoning model, the
      # `reasoning` text is billed and counted as output, and it eats the
      # 1,500-token cap before the JSON closes. 80 × 4/14 ≈ 23 is what it
      # actually delivers. Kept enabled only as a last-resort fallback for the
      # day OpenRouter is unreachable; nothing should ever route here first.
      - model: deepseek-v4-flash
        quality: 23
        # $0.22/$0.66 per 1M off-peak, double during peak (01:00-04:00 and
        # 06:00-10:00 UTC on weekdays). The off-peak price is the one written
        # here, so the guard *under*-counts during peak rather than over —
        # which is the wrong direction for a ceiling and the reason this model
        # should not be the one doing the work. It is a last resort.
        usd_per_1m_in: 0.22
        usd_per_1m_out: 0.66
        # A reasoning model: the `reasoning` text is billed and counted as
        # output, and at the global 1,500 it spent the whole cap before the
        # JSON closed — 28 truncations across 14 pages on 2026-08-24, all
        # charged. Per-model since 2026-08-27, so raising it here does not hand
        # the same number to Groq, whose free tier reserves prompt + max_tokens
        # against an 8,000-token minute window before generating.
        max_output_tokens: 4000

  # ── OpenRouter, paid tier ─────────────────────────────────────────────────
  # Same key as the free entry above, a separate provider because `paid` is a
  # provider-level flag and the two must not share a budget: the free one is
  # capped at 50 requests a day and this one is not.
  #
  # Measured on 14 Hungarian pages, 2026-08-24, `POST /v1/score?locale=hu`.
  - name: openrouter_paid
    # Disabled 2026-09-05 alongside `allow_paid: false` — see there. It shares
    # OPENROUTER_API_KEY with the free `openrouter` entry above, and that key
    # now has $10.80 behind it, so this is the one paid provider that could
    # actually succeed in spending. Off is the point.
    enabled: false
    paid: true
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    rpm: 60
    rpd: 100000
    models:
      # DeepSeek V4 Flash 0423: $0.0574 in / $0.1148 out per 1M, cache read
      # $0.01148. Named vendor, MIT licence, 1M context, 17 providers behind
      # it on OpenRouter — so a single provider going down does not stop it.
      #
      # Measured 80 on 13 of 14 Hungarian pages: the same score as the four
      # times more expensive 0731 above, on more than three times as many
      # answers. Two truncations out of fourteen, against that one's
      # twenty-eight.
      - model: deepseek/deepseek-v4-flash
        quality: 80
        # Checked against OpenRouter's own /api/v1/models on 2026-08-27:
        # $0.0795 in / $0.159 out per 1M, up from the $0.0574/$0.1148 measured
        # on 2026-08-24 and still about a quarter of DeepSeek's own API. Prices
        # move; this one is the input to a spend guard, so re-read it from the
        # catalogue rather than trusting this line indefinitely.
        usd_per_1m_in: 0.0795
        usd_per_1m_out: 0.159
        # Same reasoning-model problem as the 0731 above, and it still
        # truncated 2 of 14 pages at the global cap.
        max_output_tokens: 4000
      # Qwen3.7 Flash ($0.03/$0.13) was measured and REMOVED the same day: it
      # answered **0 of 14** pages, truncated on every one. It reasons at
      # length — eighty tokens of it for a one-word question — and the
      # `reasoning` text is billed as output, so it spends the whole 1,500-token
      # cap before the JSON closes. The cheapest list price on the market and
      # 100% waste at our settings; the truncated calls are still charged.
      # Re-measure it if `max_output_tokens` ever becomes per-provider.
