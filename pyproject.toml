[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meetapedia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "html2text>=2024.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "APScheduler>=3.10",
    "structlog>=24.1",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "resend>=2.0",
    "playwright>=1.44",
    "google-auth>=2.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "pillow>=10.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Ruff's historical default set, written down. It was implicit until 2026-09-17,
# when a fresh `pip install -e ".[dev]"` picked up ruff 0.16.8 — whose defaults
# are wider — and `ruff check scraper/ tests/` went from clean to 351 findings
# on unchanged code. Nothing had broken: 108 of them were `except Exception`,
# 97 a `datetime.UTC` alias preference, 61 import ordering.
#
# The floor in `[project.optional-dependencies]` is `ruff>=0.4`, so the version
# is not the contract and pinning one would only move the surprise to whoever
# bumps it. Naming the rules is what makes the command mean the same thing on a
# new laptop as in CI. Adding a rule family is then a deliberate commit, with
# the findings it produces fixed in that same commit.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
